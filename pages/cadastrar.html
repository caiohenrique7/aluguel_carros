<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0F14">
    <meta name="description" content="Encontre o carro ideal para sua próxima viagem com a Car Horizon.">
    <title>Car Horizon | Aluguel de Carros</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="inicio">

        <header class="header-login">
            <div class="logo-header">
                <a href="../index.html" aria-label="Car Horizon - Página inicial">
                    <img src="../assets/images/logo/logoCH.png" alt="Car Horizon">
                </a>
            </div>
        </header>

        <main>

            <div class="login container">
                <div class="img-left">
                    <img src="../assets/images/login.png" alt="login-image">
                </div>
                <div class="form-right">

                    <h2>Faça seu Cadastro</h2>

                    <div class="input-group">
                        <input type="text" id="nome" placeholder=" " required>
                        <label for="nome">Nome Completo</label>
                    </div>
                    <div class="input-group">
                        <input type="text" id="cpf" placeholder=" " required>
                        <label for="cpf">CPF</label>
                    </div>

                    <div class="input-group">
                        <input type="email" id="email" placeholder=" " required>
                        <label for="email">E-mail</label>
                    </div>

                    <div class="input-group">
                        <input type="email" id="email-confirmar" placeholder=" " required>
                        <label for="email-confirmar">Repita seu E-mail</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="senha" placeholder=" " required>
                        <label for="senha">Senha</label>
                    </div>

                    <button class="btn-hero btn-login" id="cadastrarLogin">Cadastrar</button>
                    <span>Já tem conta?</span>
                    <a href="./login.html" class="btn-hero btn-login" id="cadastroLogin">Entrar</a>

                </div>
            </div>
        </main>

</body>


</html>
